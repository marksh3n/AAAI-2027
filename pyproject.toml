[project]
name = "outcome-determination"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "transformers>=4.44,<5",  # 5.x changes how many BOS a string prompt gets
    "accelerate>=0.33",
    "datasets>=2.20",
    "math-verify>=0.5",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    "scikit-learn>=1.5",
    "scipy>=1.11",
    "huggingface_hub>=0.24",
    "joblib>=1.3",
    "matplotlib>=3.9",
]

[tool.uv]
package = false
